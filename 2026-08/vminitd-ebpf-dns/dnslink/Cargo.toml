[package]
name = "dnslink"
version = "0.1.0"
edition = "2021"
description = "Static eBPF DNS-redirect loader (attach mode: cgroup sockaddr hooks)"

# One external crate (libc) for the non-bpf syscalls (mount/execve);
# everything else stays hand-rolled so builds stay light.
[dependencies]
libc = "0.2.189"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"