name: udp_bind_matrix

# Runs only when the script itself changes on `main` (paths filter).
# Pushes from the auto-PR branch never touch udp_bind_matrix.py, so they
# do NOT re-trigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - '2026-08/udp_bind_matrix/udp_bind_matrix.py'

permissions:
  contents: write
  pull-requests: write

# Cancel an in-flight run if a newer push to the script arrives, so we never
# open duplicate PRs back-to-back.
concurrency:
  group: udp-bind-matrix
  cancel-in-progress: true

jobs:
  run:
    name: Run on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run udp_bind_matrix.py
        shell: bash
        run: |
          python3 2026-08/udp_bind_matrix/udp_bind_matrix.py \
            > "udp_bind_matrix-${{ matrix.os }}.txt" 2>&1

      - name: Upload output
        uses: actions/upload-artifact@v7
        with:
          name: udp-bind-matrix-${{ matrix.os }}
          path: udp_bind_matrix-${{ matrix.os }}.txt
          retention-days: 1

  collect-and-pr:
    name: Commit outputs and open PR
    needs: run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download outputs
        uses: actions/download-artifact@v8
        with:
          path: downloaded
          pattern: udp-bind-matrix-*

      - name: Stage outputs
        shell: bash
        run: |
          set -euo pipefail
          dest=2026-08/udp_bind_matrix/results
          mkdir -p "$dest"
          cp downloaded/udp-bind-matrix-ubuntu-latest/udp_bind_matrix-ubuntu-latest.txt \
             "$dest/udp_bind_matrix-linux.txt"
          cp downloaded/udp-bind-matrix-macos-latest/udp_bind_matrix-macos-latest.txt \
             "$dest/udp_bind_matrix-macos.txt"
          ls -la "$dest"

      # Even when triggered, skip the PR entirely if the output files are
      # byte-identical to what is already committed (reduces noise PRs).
      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- 2026-08/udp_bind_matrix/results)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dest=2026-08/udp_bind_matrix/results
          branch=gh-actions/udp-bind-matrix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$dest"
          git commit -m "Update udp_bind_matrix results (Linux + macOS)"
          git push -f origin "$branch"

      - name: Open PR (or update the existing one)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch=gh-actions/udp-bind-matrix
          printf -v body 'Auto-generated by the udp_bind_matrix workflow.\n\n- Triggered by: `%s` on `%s`\n- Linux runner: `ubuntu-latest`\n- macOS runner: `macos-latest`\n\nMerge to commit the freshly generated bind-matrix output files.' \
            "${{ github.event_name }}" "${{ github.sha }}"
          pr_num=$(gh pr list --head "$branch" --state open --json number \
            --jq '.[0].number // empty')
          if [ -n "$pr_num" ]; then
            echo "Open PR #$pr_num already exists for $branch; the force-push kept it up to date."
          else
            gh pr create --base main --head "$branch" \
              --title "Update udp_bind_matrix results (Linux + macOS)" \
              --body "$body"
          fi
