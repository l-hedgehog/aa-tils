name: build-vminitd-ebpf-dns

on:
  push:
    branches: [main]
    paths:
      - '2026-08/vminitd-ebpf-dns/**'
  workflow_dispatch:
    inputs:
      vminit-version:
        description: >
          Tag of the upstream ghcr.io/apple/containerization/vminit base
          image to build on. Leave empty to follow the latest scVersion in
          apple/container's Package.swift.
        required: false
        default: ''
      tag:
        description: >
          Output tag to push to GHCR. Leave empty to default to the short
          commit SHA of the commit that triggered this run.
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: build-vminitd-ebpf-dns
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/vminitd-ebpf-dns
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: btf
            make_var: "BTF=1"
            tag_suffix: ""
          - name: legacy
            make_var: ""
            tag_suffix: "-legacy"
    defaults:
      run:
        working-directory: 2026-08/vminitd-ebpf-dns
    steps:
      - name: Checkout (with vmlinux.h submodule, pinned)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve upstream vminit version
        run: |
          if [ -n "${{ inputs.vminit-version }}" ]; then
            VMINIT_VERSION="${{ inputs.vminit-version }}"
          else
            VMINIT_VERSION="$(curl -fsSL --max-time 30 \
              https://raw.githubusercontent.com/apple/container/main/Package.swift \
              | sed -n 's/.*let scVersion = "\([^"]*\)".*/\1/p' | head -1)"
            case "$VMINIT_VERSION" in
              [0-9]*.[0-9]*.[0-9]) ;;
              *) echo "couldn't parse scVersion, using 0.41.0"; VMINIT_VERSION="0.41.0" ;;
            esac
          fi
          echo "VMINIT_VERSION=$VMINIT_VERSION" >> "$GITHUB_ENV"
          echo "base vminit:$VMINIT_VERSION"

      - name: Install toolchain deps (clang, libbpf headers, musl linker)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libbpf-dev linux-libc-dev llvm musl-tools
          clang --version | head -1

      - name: Install rustc (aarch64-musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 2026-08/vminitd-ebpf-dns/dnslink

      - name: Build eBPF object (system libbpf + vmlinux.h submodule)
        run: make -C ebpf ${{ matrix.make_var }}

      - name: Stage eBPF object into dnslink
        run: cp ebpf/dns_sockaddr.bpf.o dnslink/

      - name: Build static dnslink (aarch64-musl)
        run: |
          cd dnslink
          cargo build --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/dnslink

      - name: Stage dnslink binary into init-image
        run: |
          cp dnslink/target/aarch64-unknown-linux-musl/release/dnslink init-image/dnslink
          chmod +x init-image/dnslink

      # Tag = input.tag override, else short commit SHA; legacy row appends
      # -legacy. metadata-action handles both + OCI labels.
      - name: Extract Docker tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,suffix=${{ matrix.tag_suffix }},enable=${{ inputs.tag == '' }}
            type=raw,value=${{ inputs.tag }},suffix=${{ matrix.tag_suffix }},enable=${{ inputs.tag != '' }}

      - name: Log in to GHCR (public package)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Path context resolved from the repo root (action steps ignore the
      # job-level working-directory). Uses buildx preinstalled on the runner.
      - name: Build and push init image
        uses: docker/build-push-action@v7
        with:
          context: 2026-08/vminitd-ebpf-dns/init-image
          build-args: VMINIT_VERSION=${{ env.VMINIT_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show pushed reference
        run: echo "pushed ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
